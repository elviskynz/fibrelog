<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fibre Records</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      color: #1b2a3a;
    }

    h1 {
      margin: 0;
      padding: 18px 20px;
      background: #0b2545;
      color: #ffffff;
      font-size: 24px;
      border-bottom: 4px solid #f2b705;
    }

    h2 {
      color: #0b2545;
      margin-top: 24px;
    }

    #loginBox, #app {
      width: calc(100% - 32px);
      max-width: 600px;
      margin: 16px auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    #loginBox br, #app br { display: none; }

    input, select {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 16px;
      border: 1px solid #b8c4d2;
      border-radius: 8px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #0f9d9a;
      box-shadow: 0 0 0 3px rgba(15, 157, 154, 0.2);
    }

    input[type="checkbox"] {
      display: inline-block;
      width: auto;
      margin: 0 6px 12px 0;
    }

    label { display: block; margin-bottom: 12px; }

    button {
      padding: 10px 16px;
      font-size: 16px;
      background: #0f9d9a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #0c7f7c; }

    button.edit { background: #0b2545; }
    button.edit:hover { background: #163a66; }

    button.delete { background: #c62828; }
    button.delete:hover { background: #9e1f1f; }

    .card {
      border: 1px solid #d5dde8;
      border-left: 6px solid #f2b705;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      background: #fafcff;
      line-height: 1.6;
    }

    .card a { color: #0f9d9a; font-weight: bold; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    #whoami { margin: 0; font-weight: bold; color: #0b2545; }

    #adminPanel {
      margin-top: 24px;
      padding: 16px;
      background: #fff8e1;
      border: 1px solid #f2b705;
      border-radius: 10px;
    }

    #adminPanel h2 { margin-top: 0; }

    .techRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #ecd9a0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Fibre Records</h1>

  <!-- LOGIN SCREEN -->
  <div id="loginBox">
    <h2>Technician login</h2>
    <input id="email" type="email" placeholder="Email"><br><br>
    <input id="password" type="password" placeholder="Password"><br><br>
    <button onclick="login()">Log in</button>
  </div>

  <!-- MAIN APP (hidden until logged in) -->
  <div id="app" style="display:none">
    <div class="topbar">
      <p id="whoami"></p>
      <button onclick="logout()">Log out</button>
    </div>

    <h2>Add a new box</h2>
    <input id="name" placeholder="Name e.g. FAT-023"><br><br>

    <select id="type">
      <option>FAT</option>
      <option>FDT</option>
      <option>Closure</option>
    </select><br><br>

    <input id="location" placeholder="Location e.g. pole opposite the shop"><br><br>
    <input id="gps" placeholder="GPS e.g. -1.2921, 36.8219">
    <button type="button" onclick="useMyLocation()">Use my location</button><br><br>

    <input id="splitter" placeholder="Splitter e.g. 1:8"><br><br>
    <input id="total" type="number" placeholder="Total ports"><br><br>
    <input id="used" type="number" placeholder="Ports used"><br><br>
    <input id="power" placeholder="Power in dBm e.g. -18.5"><br><br>

    <button id="saveBtn" onclick="addBox()">Save</button>

    <h2>Saved boxes</h2>
    <input id="search" placeholder="Search name, type or location" oninput="showBoxes()"><br><br>
    <label>
      <input type="checkbox" id="onlyFree" onchange="showBoxes()">
      Show only boxes with free ports
    </label><br><br>
    <div id="list"></div>

    <!-- ADMIN PANEL (only shown to company admins) -->
    <div id="adminPanel" style="display:none">
      <h2>Manage technicians</h2>
      <input id="techEmail" type="email" placeholder="Technician email"><br><br>
      <input id="techPassword" type="text" placeholder="Temporary password (min 8 characters)"><br><br>
      <button onclick="addTechnician()">Add technician</button>

      <h3>Your technicians</h3>
      <div id="techList"></div>
    </div>
  </div>

  <!-- Supabase library (this tag must stay empty) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Our own code -->
  <script>
const db = supabase.createClient(
  "https://qisgywckcwfnpdkblqko.supabase.co",
  "sb_publishable_oC4chif6HVowZd9Eno2V5g_6WlwWQXC"
);

let boxes = [];
let editId = null;

// Makes text safe to show on the page (stops pasted code from running)
function esc(text) {
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function loadBoxes() {
  const { data, error } = await db
    .from("boxes")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    alert("Could not load: " + error.message);
    return;
  }
  boxes = data;
  showBoxes();
}

async function addBox() {
  const box = {
    name: document.getElementById("name").value,
    type: document.getElementById("type").value,
    location: document.getElementById("location").value,
    gps: document.getElementById("gps").value,
    splitter: document.getElementById("splitter").value,
    total: Number(document.getElementById("total").value),
    used: Number(document.getElementById("used").value),
    power: document.getElementById("power").value
  };

  let result;
  if (editId === null) {
    result = await db.from("boxes").insert(box);
  } else {
    result = await db.from("boxes").update(box).eq("id", editId);
  }

  if (result.error) {
    alert("Could not save: " + result.error.message);
    return;
  }

  editId = null;
  document.getElementById("saveBtn").textContent = "Save";
  ["name", "location", "gps", "splitter", "total", "used", "power"].forEach(id => {
    document.getElementById(id).value = "";
  });
  loadBoxes();
}

function showBoxes() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  const searchText = document.getElementById("search").value.toLowerCase();
  const onlyFree = document.getElementById("onlyFree").checked;

  for (const box of boxes) {
    const free = box.total - box.used;

    const matchesSearch =
      (box.name || "").toLowerCase().includes(searchText) ||
      (box.type || "").toLowerCase().includes(searchText) ||
      (box.location || "").toLowerCase().includes(searchText);

    if (!matchesSearch) continue;
    if (onlyFree && free <= 0) continue;

    const mapLink = "https://www.google.com/maps?q=" + encodeURIComponent((box.gps || "").replace(/\s/g, ""));

    list.innerHTML += `
      <div class="card">
        <b>${esc(box.name)}</b> (${esc(box.type)})<br>
        Location: ${esc(box.location)}<br>
        <a href="${mapLink}" target="_blank">Open in Google Maps</a><br>
        Splitter: ${esc(box.splitter)}<br>
        Ports: ${esc(box.used)} used of ${esc(box.total)}, <b>${free} free</b><br>
        Power: ${esc(box.power)} dBm<br><br>
        <button class="edit" onclick="editBox(${box.id})">Edit</button>
        <button class="delete" onclick="deleteBox(${box.id})">Delete</button>
      </div>
    `;
  }
}

async function deleteBox(id) {
  if (!confirm("Delete this box?")) return;

  const { error } = await db.from("boxes").delete().eq("id", id);
  if (error) {
    alert("Could not delete: " + error.message);
    return;
  }

  editId = null;
  document.getElementById("saveBtn").textContent = "Save";
  loadBoxes();
}

function editBox(id) {
  const box = boxes.find(b => b.id === id);

  document.getElementById("name").value = box.name;
  document.getElementById("type").value = box.type;
  document.getElementById("location").value = box.location;
  document.getElementById("gps").value = box.gps;
  document.getElementById("splitter").value = box.splitter;
  document.getElementById("total").value = box.total;
  document.getElementById("used").value = box.used;
  document.getElementById("power").value = box.power;

  editId = id;
  document.getElementById("saveBtn").textContent = "Update";
  window.scrollTo(0, 0);
}

function useMyLocation() {
  if (!navigator.geolocation) {
    alert("This device does not support location.");
    return;
  }

  const gpsBox = document.getElementById("gps");
  gpsBox.value = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    (position) => {
      const lat = position.coords.latitude.toFixed(6);
      const lng = position.coords.longitude.toFixed(6);
      gpsBox.value = lat + ", " + lng;
    },
    (error) => {
      gpsBox.value = "";
      alert("Could not get location: " + error.message);
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

// ---------- ADMIN PANEL ----------

// Calls our secure Edge Function and shows a clear message if it fails
async function callAdmin(body) {
  const { data, error } = await db.functions.invoke("manage-technicians", { body: body });

  if (error) {
    let message = error.message;
    try {
      const details = await error.context.json();
      if (details.error) message = details.error;
    } catch (e) {}
    alert(message);
    return null;
  }
  return data;
}

async function loadTechnicians() {
  const data = await callAdmin({ action: "list" });
  if (!data) return;

  const techList = document.getElementById("techList");
  techList.innerHTML = "";

  if (data.technicians.length === 0) {
    techList.textContent = "No technicians yet.";
    return;
  }

  for (const tech of data.technicians) {
    const row = document.createElement("div");
    row.className = "techRow";

    const label = document.createElement("span");
    label.textContent = tech.email;

    const btn = document.createElement("button");
    btn.className = "delete";
    btn.textContent = "Remove";
    btn.onclick = () => removeTechnician(tech.id, tech.email);

    row.appendChild(label);
    row.appendChild(btn);
    techList.appendChild(row);
  }
}

async function addTechnician() {
  const email = document.getElementById("techEmail").value.trim();
  const password = document.getElementById("techPassword").value;

  if (!email || password.length < 8) {
    alert("Enter an email and a password of at least 8 characters.");
    return;
  }

  const data = await callAdmin({ action: "create", email: email, password: password });
  if (!data) return;

  document.getElementById("techEmail").value = "";
  document.getElementById("techPassword").value = "";
  alert("Technician added. Give them the email and password.");
  loadTechnicians();
}

async function removeTechnician(userId, email) {
  if (!confirm("Remove " + email + "? They will no longer be able to log in.")) return;

  const data = await callAdmin({ action: "remove", userId: userId });
  if (!data) return;
  loadTechnicians();
}

// ---------- LOGIN ----------

async function login() {
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    alert("Login failed: " + error.message);
    return;
  }
  checkLogin();
}

async function logout() {
  await db.auth.signOut();
  checkLogin();
}

async function checkLogin() {
  const { data } = await db.auth.getSession();
  const session = data.session;

  if (!session) {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("app").style.display = "none";
    return;
  }

  // Find out which company and role this person has
  const { data: profile } = await db
    .from("profiles")
    .select("role, company_id")
    .eq("id", session.user.id)
    .maybeSingle();

  if (!profile) {
    alert("This account is not linked to a company. Please contact the administrator.");
    await db.auth.signOut();
    checkLogin();
    return;
  }

  const { data: company } = await db
    .from("companies")
    .select("name")
    .eq("id", profile.company_id)
    .maybeSingle();

  document.getElementById("whoami").textContent =
    (company ? company.name : "Your company") + " · " + profile.role;

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  const isAdmin = profile.role === "admin";
  document.getElementById("adminPanel").style.display = isAdmin ? "block" : "none";

  loadBoxes();
  if (isAdmin) loadTechnicians();
}

checkLogin();
  </script>
</body>
</html>
